<div class="container mt-4">
  <h2 *ngIf="isNew">Add Trip</h2>
  <h2 *ngIf="!isNew">Edit Trip</h2>

  <form (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Code</label>
      <input class="form-control" [(ngModel)]="trip.code" name="code" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Name</label>
      <input class="form-control" [(ngModel)]="trip.name" name="name" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Length (days)</label>
      <input type="number" class="form-control" [(ngModel)]="trip.length" name="length" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Start Date</label>
      <input type="date" class="form-control" [(ngModel)]="trip.start" name="start" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Resort</label>
      <input class="form-control" [(ngModel)]="trip.resort" name="resort" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Price Per Person</label>
      <input type="number" class="form-control" [(ngModel)]="trip.perPerson" name="perPerson" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Image URL</label>
      <input class="form-control" [(ngModel)]="trip.image" name="image">
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" [(ngModel)]="trip.description" name="description"></textarea>
    </div>

    <button type="submit" class="btn btn-primary me-2">
      {{ isNew ? 'Add Trip' : 'Save Changes' }}
    </button>
    <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
  </form>
</div>
